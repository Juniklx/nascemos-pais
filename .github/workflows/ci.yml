name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master
      - feature/privacy-data-controls

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicação
        run: npm run build

      - name: Executar testes Angular
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Executar testes das regras do Firestore
        run: >
          npx firebase-tools@latest emulators:exec
          --only firestore
          --project nascemos-pais
          "npm run test:firestore-rules"