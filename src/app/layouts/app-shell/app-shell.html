<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__brand-icon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 21C12 21 5 17 5 10C5 6 8 3 12 3C16 3 19 6 19 10C19 17 12 21 12 21Z"></path>
          <path d="M12 3V21"></path>
        </svg>
      </div>

      <strong>Nascemos Pais</strong>
    </div>

    <nav class="sidebar__nav" aria-label="Navegação principal">
      <a class="nav-item" routerLink="/home" routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span aria-hidden="true">⌂</span>
        Início
      </a>

      <a class="nav-item" routerLink="/routine" routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span aria-hidden="true">◷</span>
        Rotina
      </a>

      <a class="nav-item" routerLink="/voice" routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span aria-hidden="true">♩</span>
        Voz
      </a>

      <a class="nav-item" routerLink="/history" routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span aria-hidden="true">□</span>
        Histórico
      </a>

      <a class="nav-item" routerLink="/profile" routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span aria-hidden="true">♙</span>
        Perfil
      </a>
    </nav>

    <div class="sidebar__baby">
      <div class="avatar">
        {{ babyName().charAt(0).toUpperCase() }}
      </div>

      <span>{{ babyName() }}</span>
    </div>
  </aside>

  <main class="home">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegação inferior">
    <a class="bottom-nav__item" routerLink="/home" routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }">
      <span aria-hidden="true">⌂</span>
      <small>Início</small>
    </a>

    <a class="bottom-nav__item" routerLink="/routine" routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }">
      <span aria-hidden="true">◷</span>
      <small>Rotina</small>
    </a>

    <a class="bottom-nav__item bottom-nav__item--voice" routerLink="/voice" routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }">
      <span aria-hidden="true">♩</span>
      <small>Voz</small>
    </a>

    <a class="bottom-nav__item" routerLink="/history" routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }">
      <span aria-hidden="true">↶</span>
      <small>Histórico</small>
    </a>

    <a class="bottom-nav__item" routerLink="/profile" routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }">
      <span aria-hidden="true">♙</span>
      <small>Perfil</small>
    </a>
  </nav>
</div>
