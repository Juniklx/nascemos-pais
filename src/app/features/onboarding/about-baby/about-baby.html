<main class="onboarding">
  <header class="onboarding__header">
    <a
      class="back-link"
      routerLink="/onboarding/about-you"
      aria-label="Voltar para a etapa anterior"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path d="M19 12H5"></path>
        <path d="M11 18L5 12L11 6"></path>
      </svg>

      <span>Voltar</span>
    </a>

    <div class="brand">
      <div class="brand__icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7V12L15 15"></path>
        </svg>
      </div>

      <span class="brand__name">Nascemos Pais</span>
    </div>

    <div class="step">
      <span class="step__dot"></span>
      <span>2 de 2</span>
    </div>
  </header>

  <section class="onboarding__content">
    <div class="onboarding__intro">
      <h1>Agora, sobre o bebê</h1>

      <p>
        Essas informações ajudam a organizar a rotina.
      </p>
    </div>

    <form
      class="onboarding__form"
      [formGroup]="form"
      (ngSubmit)="finish()"
    >
      <div class="field">
        <label for="babyName">
          Nome do bebê
        </label>

        <input
          id="babyName"
          type="text"
          autocomplete="off"
          placeholder="Digite o nome do bebê"
          formControlName="babyName"
        />
      </div>

      <div class="field">
        <label for="birthDate">
          Data de nascimento
        </label>

        <input
          id="birthDate"
          type="date"
          [max]="today"
          formControlName="birthDate"
        />
      </div>

      @if (babyName.value && birthDate.value && birthDate.valid) {
        <div class="baby-preview">
          <div class="baby-preview__avatar">
            {{ babyName.value.charAt(0).toUpperCase() }}
          </div>

          <div class="baby-preview__info">
            <strong>{{ babyName.value }}</strong>

            <span>{{ babyAge() }}</span>
          </div>
        </div>
      }

      <button
        class="continue-button"
        type="submit"
        [disabled]="form.invalid"
      >
        <span>Começar nossa rotina</span>

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path d="M5 12H19"></path>
          <path d="M13 6L19 12L13 18"></path>
        </svg>
      </button>
    </form>
  </section>
</main>
