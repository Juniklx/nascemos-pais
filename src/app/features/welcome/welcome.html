<main class="welcome">
  <header class="welcome__header">
    <div class="brand">
      <div class="brand__icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7V12L15 15"></path>
        </svg>
      </div>

      <span class="brand__name">Nascemos Pais</span>
    </div>
  </header>

  <section class="welcome__content">
    <h1 class="welcome__title">
      A rotina muda.
      <br />
      Vocês não precisam lembrar de tudo.
    </h1>

    <p class="welcome__description">
      Registre mamadas, sono e trocas e acompanhe o dia do seu bebê de forma simples.
    </p>

    <button class="welcome__button" type="button" routerLink="/onboarding/about-you">
      <span>Começar</span>

      <svg
        class="welcome__button-icon"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path d="M5 12H19"></path>
        <path d="M13 6L19 12L13 18"></path>
      </svg>
    </button>
  </section>

  <div class="welcome__spacer" aria-hidden="true"></div>
</main>
